<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="/style.css">
    <script src="./admin.js" defer></script>
    <title>BaZsi Borbély Szalon - Admin</title>
</head>
<body>
    <nav class="navbar navbar-expand-sm sticky-top">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">BaZsi Borbély Szalon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Nyitás/csukás">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/">Kezdőlap</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/foglalas/#">Foglalás</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">

        <h1 class="mb-4">Foglalások kezelése</h1>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Keresés és szűrés</h5>

                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="keres" class="form-label">Keresés név alapján</label>
                        <input type="text" id="keres" class="form-control" placeholder="Boti xdddd">
                    </div>

                    <div class="col-md-4">
                        <label for="fodraszszures" class="form-label">Fodrász</label>
                        <select id="fodraszszures" class="form-select">
                            <option value="osszesf">Összes fodrász</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label for="szolgaltatasszures" class="form-label">Szolgáltatás</label>
                        <select id="szolgaltatasszures" class="form-select">
                            <option value="osszessz">Összes szolgáltatás</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex flex-wrap gap-2 justify-content-between align-items-end mb-3">
            <div>
                <label for="rendezes" class="form-label">Rendezés</label>
                <div class="d-flex gap-2">
                    <select id="rendezes" class="form-select">
                        <option value="nev">Név</option>
                        <option value="datum">Dátum</option>
                        <option value="fodrasz">Fodrász</option>
                        <option value="szolgaltatas">Szolgáltatás</option>
                    </select>
                    <button id="rendezgomb" class="btn">Rendezés</button>
                </div>
            </div>

            <div>
                <button id="kartyagomb" class="btn btn-dark">Kártyás nézet</button>
                <button id="tablegomb" class="btn btn-outline-dark">Táblázatos nézet</button>
            </div>
        </div>

        <div id="tablazat" class="table" hidden>
            <table id="tablazattorzs">
                <thead>
                    <td>Név</td>
                    <td>Email</td>
                    <td>Telefonszám:</td>
                    <td>Időpont</td>
                    <td>Fodrász</td>
                    <td>Szolgáltatás</td>
                    <td>Törles</td>
                </thead>
            </table>
        </div>
        <div id="kartyak" class="row g-3"></div>
    </div>

    <footer class="d-flex justify-content-between p-2">
        <span>BaZsi Borbély Szalon ©</span>
        <span>Készítette: Holcsek Zsombor, Uglik Barnabás</span>
    </footer>
</body>
</html>
