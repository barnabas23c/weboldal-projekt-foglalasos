<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="./style.css">
    <title>BaZsi Borbély Szalon - Foglalás</title>
    <script src="./index.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-sm sticky-top">
        <div class="container-fluid">
            <a href="#" class="navbar-brand">BaZsi Borbély Szalon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
                aria-controls="navbarContent" aria-expanded="false" aria-label="Nyitás/csukás">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarContent">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/">Kezdőlap</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/foglalas/#">Foglalás</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <main>
        <h1>Foglalás</h1>
        <div class="card">
            <form id="form" action="#" class="card-body d-grid gap-3 align-items-center" style="grid-template-columns: max-content auto;">
                <label for="nev" class="form-label m-0">Név:</label>
                <input type="text" id="nev" placeholder="Vezetéknév Keresztnév" class="form-control" autocomplete="name" required>
                <label for="email" class="form-label m-0">Email:</label>
                <input type="email" id="email" placeholder="email@szolgaltato.hu" class="form-control" autocomplete="email" required>
                <label for="tel" class="form-label m-0">Telefonszám:</label>
                <input type="tel" id="tel" placeholder="+36 00 000 0000" class="form-control" autocomplete="tel" required>
                <label for="datum" class="form-label m-0">Dátum:</label>
                <input type="date" id="datum" class="form-control" required>
                <label for="fodrasz" class="form-label m-0">Fodrász:</label>
                <select id="fodrasz" class="form-select" required>
                    <option name="" disabled selected>-- Válasszon fodrászt --</option>
                </select>
                <label for="szolgaltatas" class="form-label m-0">Szolgáltatás:</label>
                <select id="szolgaltatas" class="form-select" required>
                    <option name="" disabled selected>-- Válasszon szolgáltatást --</option>
                </select>
                <label for="idopont">Időpont:</label>
                <select id="idopont" class="form-select" required disabled>
                    <option name="" disabled selected>-- Válasszon időpontot --</option>
                </select>
                <div style="grid-column: span 2;">
                    <p>
                        Ár: <span id="ar">-</span><br>
                        Áfa: <span id="afa">-</span><br>
                        Végösszeg: <span id="vegosszeg">-</span>
                    </p>
                    <div class="d-flex justify-content-center">
                        <input id="foglalas" type="submit" class="btn btn-primary px-5 py-2" value="Foglalás">
                    </div>
                </div>
            </form>
        </div>
    </main>
    <footer class="d-flex justify-content-between p-2">
        <span>BaZsi Borbély Szalon ©</span>
        <span>Készítette: Holcsek Zsombor, Uglik Barnabás</span>
    </footer>
</body>

</html>
